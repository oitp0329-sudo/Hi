name: Build FileDude Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK licenses (pre-accept without sdkmanager downgrade)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "%s\n" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_ROOT/licenses/google-gdk-license"
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$SDK_ROOT/licenses"

      - name: Ensure debug signing keystore is present
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Ensure Gradle wrapper is executable if present
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure google-services.json is present for resource generation
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "CI_GOOGLE_SERVICES_MODE=secret" >> "$GITHUB_ENV"
          elif [ -f app/google-services.json ]; then
            echo "CI_GOOGLE_SERVICES_MODE=repo" >> "$GITHUB_ENV"
          else
            echo "CI_GOOGLE_SERVICES_MODE=placeholder" >> "$GITHUB_ENV"
            python3 -c 'import json; json.dump({"project_info":{"project_number":"1234567890","project_id":"ci-placeholder-project"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:ciplaceholder","android_client_info":{"package_name":"com.aistudio.filedude.lmsxhy"}},"oauth_client":[{"client_id":"1234567890-ciplaceholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"ci-placeholder-key"}]}],"configuration_version":"1"}, open("app/google-services.json","w"), indent=2)'
            echo "::warning::app/google-services.json was missing in this repo; using a CI placeholder so the APK compiles. Add GOOGLE_SERVICES_JSON in GitHub Secrets for Google Sign-In/Firestore/AI Logic."
          fi

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8" --stacktrace

      - name: Verify Debug APK exists, is signed, and has valid manifest
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          APKSIGNER=$(find -L "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          AAPT2=$(find -L "$SDK_ROOT/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK_PATH" | head -n 10
          fi

      - name: Upload downloadable Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDude-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach direct APK download link to GitHub Release (latest-debug)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-debug
          name: FileDude Latest Debug APK
          body: |
            Direct APK download for manual Android testing (`com.aistudio.filedude.lmsxhy`).
            Tap **app-debug.apk** below to download directly to your phone without unzipping.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true

      - name: Print direct APK download URL in Run Summary
        run: |
          {
            echo "## FileDude APK Ready"
            echo ""
            echo "- **Direct APK URL (if Release published in repo):** https://github.com/${{ github.repository }}/releases/download/latest-debug/app-debug.apk"
            echo "- **Workflow Artifact (zip):** Open **Artifacts → FileDude-Debug-APK** on this run summary page."
            if [ "${CI_GOOGLE_SERVICES_MODE:-repo}" = "placeholder" ]; then
              echo "- **Firebase Note:** Built with a placeholder \`google-services.json\` because \`app/google-services.json\` was missing in the repository. Add \`GOOGLE_SERVICES_JSON\` in GitHub Secrets (or download the APK directly from AI Studio) for live Google Sign-In, Firestore sync, and AI Logic."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build & verify signed Release APK and Internal AAB (when release secrets are set)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            gradle :app:generateSignedReleaseApk :app:bundleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8" --stacktrace
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER=$(find -L "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
            fi
          else
            echo "Release keystore secrets not set; skipping signed release APK/AAB build."
          fi

      - name: Upload signed Release APK artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: FileDude-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Internal Testing AAB artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: FileDude-Internal-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: ignore

  unit-tests:
    name: Run JVM & Robolectric Unit Tests
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "%s\n" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_ROOT/licenses/google-gdk-license"

      - name: Cache Robolectric Android SDK artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk36-${{ runner.os }}

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure google-services.json is present for resource generation
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            python3 -c 'import json; json.dump({"project_info":{"project_number":"1234567890","project_id":"ci-placeholder-project"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:ciplaceholder","android_client_info":{"package_name":"com.aistudio.filedude.lmsxhy"}},"oauth_client":[{"client_id":"1234567890-ciplaceholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"ci-placeholder-key"}]}],"configuration_version":"1"}, open("app/google-services.json","w"), indent=2)'
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8" --stacktrace
